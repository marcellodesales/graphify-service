name: 🧪 integration (matrix)
run-name: 🧪 integration — PR ${{ github.event.pull_request.number }} ${{ github.event.pull_request.head.sha }}

# Reproducible, Docker-only integration suites (PRD-005) run as a PARALLEL MATRIX
# over SUITE values, using the containerized engine tests/integration/run-integration.sh:
#   repo        T1 repository API (public sample repo, keyless)
#   memory      T2 single-repo memory (public sample repo, keyless)
#   memory2     T3 two-repo correlation, added together      (private → needs SSH_DEPLOY_KEY)
#   memory2seq  T3 two-repo correlation, added one-by-one     (private → needs SSH_DEPLOY_KEY)
#
# Each job renders the BEFORE/AFTER-merge graph structure (graphify graph-summary)
# and writes it to the job's $GITHUB_STEP_SUMMARY + uploads it as an artifact. A
# final job aggregates all suites and posts/updates ONE sticky PR comment.
#
# The private (memory2*) suites clone two PRIVATE repos over SSH; they consume the
# SSH_DEPLOY_KEY repository secret (an SSH private key with READ access to BOTH
# marcellodesales/azure-chatgpt-spa-service and …-deploy). The key is written to a
# runner-temp file at 0600, passed to the engine as SSH_KEY_FILE, never committed
# and never printed. If the secret is missing, only the private suites fail (loudly);
# the public suites still run.
on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - '.github/workflows/integration.yml'
      - 'backend/**'
      - 'graphify/**'
      - 'tests/**'
      - 'docker-compose*'
      - 'Dockerfile'
      - 'pyproject.toml'
  workflow_dispatch:

# Least privilege: matrix jobs need only read; the comment job elevates to
# pull-requests:write locally. GITHUB_TOKEN is the only credential used.
permissions:
  contents: read

concurrency:
  group: integration-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  suite:
    name: suite ${{ matrix.suite }}
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        suite: [repo, memory, memory2, memory2seq]
    env:
      SUITE: ${{ matrix.suite }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run suite (${{ matrix.suite }})
        id: run
        env:
          SSH_DEPLOY_KEY: ${{ secrets.SSH_DEPLOY_KEY }}
        run: |
          set -euo pipefail
          export GRAPH_SUMMARY_OUT="$PWD/graph-summary-$SUITE.md"

          # Private suites need the deploy key; write it to a 0600 runner-temp file.
          case "$SUITE" in
            memory2|memory2seq|all)
              if [ -z "${SSH_DEPLOY_KEY:-}" ]; then
                echo "::error title=Missing secret::SUITE=$SUITE needs the SSH_DEPLOY_KEY repo secret (read access to both private repos)."
                exit 1
              fi
              install -m 600 /dev/null "$RUNNER_TEMP/deploy_key"
              printf '%s\n' "$SSH_DEPLOY_KEY" > "$RUNNER_TEMP/deploy_key"
              export SSH_KEY_FILE="$RUNNER_TEMP/deploy_key"
              export PRIVATE=1
              ;;
            *)
              # Public, keyless suites.
              export PRIVATE=0
              ;;
          esac

          bash tests/integration/run-integration.sh

      - name: Job summary (before/after-merge graph)
        if: always()
        run: |
          {
            echo "## 🧪 integration — suite \`$SUITE\` — ${{ steps.run.outcome }}"
            echo
            if [ -f "graph-summary-$SUITE.md" ]; then
              cat "graph-summary-$SUITE.md"
            else
              echo "_(no graph summary produced)_"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Prepare artifact (status + summary)
        if: always()
        run: |
          f="graph-summary-$SUITE.md"
          {
            echo "suite \`$SUITE\` — ${{ steps.run.outcome }}"
            echo
            if [ -f "$f" ]; then cat "$f"; else echo "_(no graph summary produced)_"; fi
          } > "artifact-$SUITE.md"

      - name: Upload summary artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: graph-summary-${{ matrix.suite }}
          path: artifact-${{ matrix.suite }}.md
          if-no-files-found: warn
          retention-days: 14

  pr-comment:
    name: sticky PR comment
    needs: [suite]
    if: always() && github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - name: Download all suite summaries
        uses: actions/download-artifact@v4
        with:
          pattern: graph-summary-*
          path: summaries
          merge-multiple: true

      - name: Build & post/update sticky comment
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          MARKER="<!-- integration-graph-summary -->"
          body="$RUNNER_TEMP/comment.md"

          {
            echo "$MARKER"
            echo "## 🧪 Integration matrix — before/after-merge graph summaries"
            echo
            echo "Commit \`$HEAD_SHA\` · [workflow run]($RUN_URL)"
            echo
            shopt -s nullglob
            files=(summaries/artifact-*.md)
            if [ ${#files[@]} -eq 0 ]; then
              echo "_No suite summaries were produced._"
            else
              for f in "${files[@]}"; do
                title="$(head -1 "$f")"
                echo "<details><summary>$title</summary>"
                echo
                tail -n +2 "$f"
                echo
                echo "</details>"
                echo
              done
            fi
          } > "$body"

          # Sticky: find an existing comment carrying our marker and PATCH it,
          # else POST a new one. Uses only the built-in GITHUB_TOKEN via gh api.
          cid="$(gh api --paginate "repos/$REPO/issues/$PR/comments" \
                  --jq "map(select(.body | contains(\"$MARKER\"))) | .[0].id // empty")"
          if [ -n "$cid" ]; then
            gh api -X PATCH "repos/$REPO/issues/comments/$cid" -F body=@"$body" >/dev/null
            echo "updated sticky comment $cid"
          else
            gh api -X POST "repos/$REPO/issues/$PR/comments" -F body=@"$body" >/dev/null
            echo "created sticky comment"
          fi
